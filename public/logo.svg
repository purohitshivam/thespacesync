<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Forest Green Orbital Circle -->
  <circle cx="38" cy="42" r="34" fill="#30483A" />
  <!-- Warm Ivory Editorial Serif 'S' -->
